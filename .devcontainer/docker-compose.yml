services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgres://deceler:deceler_dev@db:5432/deceler
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres_dev
      APP_DB_PASSWORD: deceler_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates a NON-superuser owner: superusers would bypass Row Level Security.
      - ../db/docker/init.sql.tpl:/docker-entrypoint-initdb.d/init.sql.tpl:ro
      - ../db/docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20 }
volumes:
  pgdata:
