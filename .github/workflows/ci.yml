name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres_ci, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://deceler:deceler_ci@localhost:5432/deceler
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      STORAGE_DIR: /tmp/deceler-storage
      RATE_LIMIT_APPLY_PER_HOUR: "2000"
      # Local Anthropic stub started by tests/quick-check.test.mjs — no real API calls in CI.
      ANTHROPIC_API_KEY: stub-key
      ANTHROPIC_BASE_URL: http://127.0.0.1:4599
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Create a non-superuser application owner (superusers would bypass Row Level Security)
        env: { PGPASSWORD: postgres_ci }
        run: |
          psql -h localhost -U postgres -c "create user deceler with password 'deceler_ci' createrole"
          psql -h localhost -U postgres -c "create database deceler owner deceler"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run build
      - name: Start production server
        run: |
          (cd .next/standalone && PORT=3000 node server.js > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 1; done
      - run: npm run test:acceptance
      - run: npm run test:quick-check
      - if: failure()
        run: cat /tmp/server.log
