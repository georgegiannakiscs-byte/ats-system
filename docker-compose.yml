# Local or single-server deployment: app + PostgreSQL + persistent file storage.
#   APP_SECRET=$(openssl rand -hex 32) docker compose up -d
# On your own computer the easiest way is the one-click launcher (Start-Ulysse-Windows.bat or
# Start-Ulysse-Mac.command), which writes a local .env, starts everything and adds demo data.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-admin}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker/init.sql.tpl:/docker-entrypoint-initdb.d/init.sql.tpl:ro
      - ./db/docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://deceler:${POSTGRES_PASSWORD:-change-me}@db:5432/deceler
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET (openssl rand -hex 32)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: [files:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 60
  # Optional demo data (company "Aegean Analytics", jobs, applications), for trying it out locally:
  #   docker compose --profile demo run --rm seed
  # Never run it against a public deployment: it creates demo@example.com with a known password.
  seed:
    profiles: [demo]
    image: node:22-bookworm-slim
    depends_on: { app: { condition: service_healthy } }
    working_dir: /repo
    environment:
      SEED_BASE_URL: http://app:3000
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./tests/fixtures:/repo/tests/fixtures:ro
    command: ["node", "scripts/seed-demo.mjs"]
    restart: "no"
volumes:
  pgdata:
  files:
